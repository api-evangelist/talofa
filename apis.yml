aid: talofa
name: Talofa
description: 'Talofa Games is a consumer mobile game studio, backed by Insight Partners,
  that builds location-based and fitness-driven games where real-world movement powers
  play. Its titles include Run Legends, a cooperative running RPG for iOS and Android
  in which players'' real-world runs and steps fuel monster battles, and Monster Walk,
  a walking game currently in closed beta. The company distributes through the Apple
  App Store and Google Play and runs its community on Discord. As a consumer game
  publisher it exposes no public developer API, SDK, or documentation surface; this
  API Evangelist profile tracks it as a company with no API footprint.'
